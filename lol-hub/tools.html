<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Herramientas — Tictac</title><link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
</head><body>
<header class="hero hero-sm"><canvas id="fx"></canvas><h1>Herramientas de guerra</h1><div class="tagline">Sorteos y ruletas</div></header>
<div class="tools"><div class="tools-grid">
  <div class="tool"><h3>🎲 Campeón aleatorio</h3><p>Que decida el destino.</p><div class="out" id="champ-out">—</div><button class="btn primary" onclick="rc()">Girar ruleta</button></div>
  <div class="tool"><h3>🎯 ¿Quién elige primero?</h3><p>Sortea quién pickea o banea.</p><div class="out" id="player-out">—</div><button class="btn primary" onclick="rp()">Sortear</button></div>
  <div class="tool"><h3>🪙 Lado azul o rojo</h3><p>Para las custom.</p><div class="out" id="coin-out">—</div><button class="btn primary" onclick="coin()">Lanzar</button></div>
  <div class="tool"><h3>🎰 Reto del día</h3><p>Para picar la partida.</p><div class="out" id="dare-out">—</div><button class="btn primary" onclick="dare()">Sacar reto</button></div>
</div></div>
<footer><div class="disclaimer">League of Legends © Riot Games, Inc.</div></footer>
<script src="config.js"></script><script src="common.js"></script>
<script>
const D=["Jugar sin botas hasta el minuto 15","Prohibido recall voluntario 5 min","Solo pings, nada de chat","El que muera primero invita","Emote tras cada kill","Build meme permitida","Cámara desbloqueada toda la partida","First blood o 10 flexiones"];
function rc(){const o=document.getElementById("champ-out");if(!CHAMPIONS.length){o.textContent="Cargando…";return;}let t=0;const s=setInterval(()=>{const c=CHAMPIONS[Math.floor(Math.random()*CHAMPIONS.length)];o.innerHTML=`<img src="${champIcon(c.id)}">${c.name}`;if(++t>14)clearInterval(s);},70);}
function rp(){const o=document.getElementById("player-out");const n=PEOPLE.map(p=>p.person);let t=0;const s=setInterval(()=>{o.textContent=n[Math.floor(Math.random()*n.length)];if(++t>14)clearInterval(s);},70);}
function coin(){const o=document.getElementById("coin-out");let t=0;const s=setInterval(()=>{o.textContent=Math.random()>.5?"🔵 Lado AZUL":"🔴 Lado ROJO";if(++t>12)clearInterval(s);},80);}
function dare(){const o=document.getElementById("dare-out");o.style.fontSize="14px";let t=0;const s=setInterval(()=>{o.textContent=D[Math.floor(Math.random()*D.length)];if(++t>14)clearInterval(s);},80);}
(async function(){injectNav("tools.html");initFX();await loadDDragon({items:false});})();
</script></body></html>
