<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Ranking — Tictac el tiempo corre</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
</head>
<body>
<header class="hero hero-sm"><canvas id="fx"></canvas><h1>Power Ranking</h1><div class="tagline">¿Quién manda en <b id="gn"></b>? · Clasificación en vivo</div></header>
<div class="rk-tabs"><button class="rk-tab active" data-q="solo">Clasificatoria SoloQ</button><button class="rk-tab" data-q="flex">Clasificatoria Flex</button></div>
<div class="leaderboard"><div class="lb-card"><div class="lb-head"><h2>🏆 Clasificación</h2><span class="sub" id="rk-sub">SoloQ · en vivo</span></div><div id="lb-body"><div class="lb-loading">Calculando…</div></div></div></div>
<footer><div class="disclaimer">Tictac el tiempo corre no está avalada por Riot Games. League of Legends © Riot Games, Inc.</div></footer>
<script src="config.js"></script><script src="common.js"></script>
<script>
let CURQ="solo";
function renderLeaderboard(){
  const box=document.getElementById("lb-body");
  const rows=CONFIG.players.map(raw=>{const p=parseId(raw.riotId);const d=STATS[p.full]||{};const q=CURQ==="solo"?d.solo:d.flex;return{raw,p,d,q,score:rankScore(q)};}).sort((a,b)=>b.score-a.score);
  box.innerHTML=rows.map((row,i)=>{const s=row.q;const iconId=(row.raw.main||"Poro").replace(/\s|'|\./g,"");const rankTxt=s?`${TIER_ES[s.tier]||s.tier} ${s.rank}`:"Sin clasificar";const lpTxt=s?`${s.lp} LP · ${s.winrate}% WR · ${s.wins}V ${s.losses}D`:"—";const color=s?(TIER_COLORS[s.tier]||"var(--gold)"):"var(--text-dim)";const medal=i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`;
    return`<div class="lb-row top${i+1}"><div class="lb-pos">${medal}</div><img class="lb-ava" src="${champIcon(iconId)}" onerror="this.src='https://ddragon.leagueoflegends.com/cdn/${DDRAGON_VER}/img/profileicon/29.png'"><div><div class="lb-name">${row.p.name}</div><div class="lb-role">${row.raw.rol||""}</div></div><div class="lb-rank"><div class="r" style="color:${color}">${rankTxt}</div><div class="lp">${lpTxt}</div></div></div>`;}).join("");
}
(async function(){injectNav("ranking.html");document.getElementById("gn").textContent=CONFIG.groupName;initFX();await loadDDragon();renderLeaderboard();await loadLiveStats();renderLeaderboard();
  document.querySelectorAll(".rk-tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".rk-tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");CURQ=b.dataset.q;document.getElementById("rk-sub").textContent=(CURQ==="solo"?"SoloQ":"Flex")+" · en vivo";renderLeaderboard();}));})();
</script>
</body>
</html>
