<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Power Ranking — Tictac el tiempo corre</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<style>.rk-mode{max-width:1000px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lb-acc{font-size:11px;color:var(--text-dim);margin-top:2px}
.lb-alt{font-size:10px;color:var(--text-dim);margin-top:3px;display:flex;gap:5px;flex-wrap:wrap}
.lb-alt span{border:1px solid var(--line);padding:1px 6px;border-radius:8px}</style>
</head>
<body>
<header class="hero hero-sm"><canvas id="fx"></canvas><h1>Power Ranking</h1><div class="tagline">¿Quién manda en <b id="gn"></b>?</div></header>
<div class="rk-tabs"><button class="rk-tab active" data-q="solo">Clasificatoria SoloQ</button><button class="rk-tab" data-q="flex">Clasificatoria Flex</button></div>
<div class="rk-mode"><button class="fb-btn active" data-view="person">👤 Por persona</button><button class="fb-btn" data-view="account">🎮 Por cuenta</button></div>
<div class="leaderboard"><div class="lb-card"><div class="lb-head"><h2>🏆 Clasificación</h2><span class="sub" id="rk-sub">SoloQ · por persona</span></div><div id="lb-body"><div class="lb-loading">Calculando…</div></div></div></div>
<footer><div class="disclaimer">"Por persona" muestra la mejor cuenta de cada uno. League of Legends © Riot Games, Inc.</div></footer>
<script src="config.js"></script><script src="common.js"></script><script src="icons.js"></script> 
<script>
let CURQ="solo",VIEW="person";
const pick=d=>CURQ==="solo"?d.solo:d.flex;
function bestFor(n){const a=ACCOUNTS.filter(x=>x.owner===n);let b=null,bs=-2;
  a.forEach(x=>{const d=STATS[x.riotId]||{};const s=rankScore(pick(d));if(s>bs){bs=s;b={acc:x,data:d,score:s};}});return b||{acc:a[0],data:{},score:-2};}
function row(i,icon,title,sub,alt,s){
  const rt=s?`${TIER_ES[s.tier]||s.tier} ${s.rank}`:"Sin clasificar";
  const lp=s?`${s.lp} LP · ${s.winrate}% WR · ${s.wins}V ${s.losses}D`:"—";
  const c=s?(TIER_COLORS[s.tier]||"var(--gold)"):"var(--text-dim)";
  const m=i===0?"🥇":i===1?"🥈":i===2?"🥉":`${i+1}`;
  return`<div class="lb-row top${i+1}"><div class="lb-pos">${m}</div><img class="lb-ava" src="${champIcon(icon)}" loading="lazy" onerror="this.style.visibility='hidden'"><div>${title}<div class="lb-acc">${sub}</div>${alt||""}</div><div class="lb-rank"><div class="r" style="color:${c}">${rt}</div><div class="lp">${lp}</div></div></div>`;
}
function render(){
  const box=document.getElementById("lb-body");
  if(VIEW==="person"){
    const rows=PEOPLE.map(pe=>({pe,best:bestFor(pe.person)})).sort((a,b)=>b.best.score-a.best.score);
    box.innerHTML=rows.map((r,i)=>{const p=parseId(r.best.acc.riotId);const s=pick(r.best.data||{});
      const others=ACCOUNTS.filter(a=>a.owner===r.pe.person&&a.riotId!==r.best.acc.riotId);
      const alt=others.length?`<div class="lb-alt">${others.map(o=>{const d=STATS[o.riotId]||{};const os=pick(d);return `<span>${parseId(o.riotId).name}${os?` · ${TIER_ABBR[os.tier]} ${os.rank}`:""}</span>`;}).join("")}</div>`:"";
      return row(i,safeIcon(r.pe.icon),`<a class="lb-name" href="${dpmProfile(p)}" target="_blank" rel="noopener">${r.pe.person}</a>`,`mejor cuenta: ${p.name}`,alt,s);}).join("");
  }else{
    const rows=ACCOUNTS.map(a=>{const p=parseId(a.riotId);const d=STATS[a.riotId]||{};return{a,p,d,score:rankScore(pick(d))};}).sort((x,y)=>y.score-x.score);
    box.innerHTML=rows.map((r,i)=>row(i,safeIcon(r.a.main),`<a class="lb-name" href="${dpmProfile(r.p)}" target="_blank" rel="noopener">${r.p.name}</a>`,`${r.a.owner} · ${r.a.rol||""}`,"",pick(r.d))).join("");
  }
}
function sub(){document.getElementById("rk-sub").textContent=(CURQ==="solo"?"SoloQ":"Flex")+" · "+(VIEW==="person"?"por persona":"por cuenta");}
(async function(){injectNav("ranking.html");document.getElementById("gn").textContent=CONFIG.groupName;initFX();
  await loadDDragon({items:false});
  await loadLiveStats(()=>render());render();
  document.querySelectorAll(".rk-tab").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".rk-tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");CURQ=b.dataset.q;sub();render();}));
  document.querySelectorAll(".rk-mode .fb-btn").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".rk-mode .fb-btn").forEach(x=>x.classList.remove("active"));b.classList.add("active");VIEW=b.dataset.view;sub();render();}));})();
</script>
</body>
</html>
